[project]
name = "yaybo"
version = "0.2.0"
description = "Fetch, explore and export the Danish property registers, from a terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kilian Tscherny" }]
keywords = ["tinglysning", "denmark", "property", "land-registry", "tui", "mitid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Danish",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Front-Ends",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.5.5",
    "mitid-client[textual]>=0.1.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "textual>=3.1",
    "textual-plotext>=1.0",
]

[project.urls]
Homepage = "https://github.com/kiliantscherny/yaybo"
Repository = "https://github.com/kiliantscherny/yaybo"
Changelog = "https://github.com/kiliantscherny/yaybo/blob/main/CHANGELOG.md"
Issues = "https://github.com/kiliantscherny/yaybo/issues"

[project.scripts]
yaybo = "yaybo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "textual-dev>=1.7",
    "tox>=4.36",
    "tox-uv>=1.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

# The tests travel with the source archive, so anyone repackaging this can run
# them. The fixtures are real documents with invented people in them; nothing
# out of out/ or exports/ is ever in here.
[tool.uv.build-backend]
source-include = ["tests/**", "CHANGELOG.md", "CONTRIBUTING.md"]
source-exclude = ["**/__pycache__", "**/*.pyc"]
